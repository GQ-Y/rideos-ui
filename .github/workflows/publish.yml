name: Publish to npm

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type PUBLISH to confirm the npm release
        required: true
        type: string
      tag:
        description: npm dist-tag
        required: true
        default: beta
        type: choice
        options:
          - beta
          - latest

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    if: inputs.confirmation == 'PUBLISH'
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 11.8.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - name: Validate release metadata and clean source state
        run: pnpm release:check
      - name: Run the full package acceptance suite
        run: pnpm verify
      - name: Publish versioned packages through npm Trusted Publishing
        run: pnpm exec changeset publish --tag "${{ inputs.tag }}"
